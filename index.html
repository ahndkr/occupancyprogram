<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Rekap Occupancy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for CSV fetch & parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* Desain Tabel Compact */
        table { border-collapse: collapse; width: auto; font-size: 11px; }
        th, td { 
            border: 1px solid #6b7280; 
            text-align: center; 
            padding: 2px 5px; 
            white-space: nowrap; /* Memaksa sel pas dengan isi teks */
        }
        .bg-yellow-header { background-color: #FFFF00; }
        .bg-orange-header { background-color: #FCE4D6; }
    </style>
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">

    <div class="max-w-full mx-auto bg-white p-4 rounded-lg shadow-md inline-block min-w-full">
        <div class="flex justify-between items-center mb-3 border-b pb-2">
            <h1 class="text-xl font-bold">REKAP OCCUPANCY DASHBOARD</h1>
            <!-- Status Loading -->
            <div id="loadingStatus" class="text-xs font-semibold text-blue-600 animate-pulse">
                ⏳ Memuat data terbaru dari Google Sheets...
            </div>
        </div>
        
        <!-- Controls & Filters (Program + Date Range) -->
        <div class="flex flex-wrap items-center gap-3 mb-4 bg-gray-50 p-3 rounded border text-xs">
            <div class="flex items-center gap-2">
                <label class="font-semibold">Program:</label>
                <select id="programFilter" class="p-1.5 border rounded font-semibold bg-white text-xs" disabled>
                    <option value="">-- Sedang mengambil data... --</option>
                </select>
            </div>

            <div class="flex items-center gap-2 border-l pl-3 border-gray-300">
                <label class="font-semibold">Dari Tanggal:</label>
                <input type="date" id="startDateFilter" class="p-1 border rounded bg-white text-xs">
            </div>

            <div class="flex items-center gap-2">
                <label class="font-semibold">Sampai Tanggal:</label>
                <input type="date" id="endDateFilter" class="p-1 border rounded bg-white text-xs">
            </div>

            <button onclick="resetDateFilter()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded text-xs font-semibold">
                Reset Tanggal
            </button>

            <button onclick="loadGoogleSheetData()" class="ml-auto bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs font-semibold">
                🔄 Refresh Data
            </button>
        </div>

        <!-- Dashboard Header Info -->
        <div id="reportHeader" class="mb-3 hidden">
            <h2 class="font-bold text-base">REKAP OCCUPANCY</h2>
            <p class="font-semibold text-gray-700 text-xs">PERIODE: <span id="periodeText">SEPTEMBER 2026</span></p>
            <p class="font-semibold text-gray-700 text-xs">AS OF: <span id="asOfText">-</span></p>
            
            <div id="programTitle" class="mt-2 p-1 font-bold text-center text-base uppercase bg-yellow-300 border border-black">
                PROGRAM NAME
            </div>
        </div>

        <!-- Table Display (Compact Format) -->
        <div class="overflow-x-auto">
            <table id="occupancyTable" class="hidden">
                <thead>
                    <tr class="bg-yellow-header font-bold">
                        <th rowspan="2">Date</th>
                        <th rowspan="2">Slot Time</th>
                        <th rowspan="2">Slot Dur<br>(Menit)</th>
                        <th colspan="2" class="bg-orange-header">TOTAL CB DUR</th>
                        <th colspan="5">DURASI IKLAN (Menit)</th>
                        <th rowspan="2" class="bg-orange-header">AVAIL</th>
                    </tr>
                    <tr class="bg-yellow-header font-bold">
                        <th class="bg-orange-header">Dur</th>
                        <th class="bg-orange-header">%</th>
                        <th>NON CPRP</th>
                        <th>%</th>
                        <th>CPRP</th>
                        <th>%</th>
                        <th>TOTAL</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Masukkan link CSV 'Publish to web' Google Sheets Anda di sini
        const URL_DATA_1 = 'LINK_PUBLISH_CSV_DATA_1_ANDA_DI_SINI';
        const URL_DATA_2 = 'LINK_PUBLISH_CSV_DATA_2_ANDA_DI_SINI';

        let data1 = [];
        let data2 = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadGoogleSheetData();
        });

        // Event listener untuk memicu filter saat ada perubahan nilai
        document.getElementById('programFilter').addEventListener('change', renderTable);
        document.getElementById('startDateFilter').addEventListener('change', renderTable);
        document.getElementById('endDateFilter').addEventListener('change', renderTable);

        function loadGoogleSheetData() {
            const statusEl = document.getElementById('loadingStatus');
            statusEl.innerText = '⏳ Memuat data terbaru dari Google Sheets...';
            statusEl.classList.remove('hidden', 'text-green-600', 'text-red-600');
            statusEl.classList.add('text-blue-600', 'animate-pulse');

            Papa.parse(URL_DATA_1, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(res1) {
                    data1 = res1.data;
                    Papa.parse(URL_DATA_2, {
                        download: true,
                        header: true,
                        skipEmptyLines: true,
                        complete: function(res2) {
                            data2 = res2.data;
                            statusEl.innerText = '✅ Data ter-update!';
                            statusEl.classList.remove('animate-pulse', 'text-blue-600');
                            statusEl.classList.add('text-green-600');
                            
                            initDashboard();
                        },
                        error: function() { showError('Gagal memuat DATA 2'); }
                    });
                },
                error: function() { showError('Gagal memuat DATA 1'); }
            });
        }

        function showError(msg) {
            const statusEl = document.getElementById('loadingStatus');
            statusEl.innerText = '❌ ' + msg + '. Pastikan link Google Sheet dipublish (CSV).';
            statusEl.classList.remove('animate-pulse', 'text-blue-600');
            statusEl.classList.add('text-red-600');
        }

        function initDashboard() {
            const programs = [...new Set(data2.map(item => item.PROGRAM))].filter(Boolean).sort();
            const filter = document.getElementById('programFilter');
            
            filter.innerHTML = programs.map(p => `<option value="${p}">${p}</option>`).join('');
            filter.disabled = false;

            // Set Tanggal Min & Max otomatis pada input Date Picker
            const allDates = data1.map(d => d.TANGGAL).concat(data2.map(d => d.TGL)).filter(Boolean);
            if (allDates.length > 0) {
                const sortedDates = allDates.map(d => new Date(d)).sort((a, b) => a - b);
                const minDate = sortedDates[0].toISOString().split('T')[0];
                const maxDate = sortedDates[sortedDates.length - 1].toISOString().split('T')[0];

                document.getElementById('startDateFilter').min = minDate;
                document.getElementById('startDateFilter').max = maxDate;
                document.getElementById('endDateFilter').min = minDate;
                document.getElementById('endDateFilter').max = maxDate;

                const options = { day: '2-digit', month: 'short', year: '2-digit' };
                document.getElementById('asOfText').innerText = sortedDates[sortedDates.length - 1].toLocaleDateString('en-GB', options).toUpperCase();
            }

            renderTable();
        }

        function resetDateFilter() {
            document.getElementById('startDateFilter').value = '';
            document.getElementById('endDateFilter').value = '';
            renderTable();
        }

        function timeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':').map(Number);
            return (parts[0] || 0) * 60 + (parts[1] || 0) + (parts[2] || 0) / 60;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${d.getDate()}-${months[d.getMonth()]}`;
        }

        function renderTable() {
            const selectedProg = document.getElementById('programFilter').value;
            const startDate = document.getElementById('startDateFilter').value;
            const endDate = document.getElementById('endDateFilter').value;

            if (!selectedProg) return;

            document.getElementById('reportHeader').classList.remove('hidden');
            document.getElementById('occupancyTable').classList.remove('hidden');
            document.getElementById('programTitle').innerText = selectedProg;

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // Filter data2 (Jadwal Program) berdasarkan Rentang Tanggal
            let progSchedules = data2.filter(d => d.PROGRAM === selectedProg);

            if (startDate) {
                progSchedules = progSchedules.filter(d => new Date(d.TGL) >= new Date(startDate));
            }
            if (endDate) {
                progSchedules = progSchedules.filter(d => new Date(d.TGL) <= new Date(endDate));
            }

            progSchedules.forEach(row => {
                const date = row.TGL;
                const slotTime = row['SLOT TIME'] || row.SLOT_TIME || '';
                const slotDurMin = timeToMinutes(row['SLOT DUR'] || row.SLOT_DUR);

                const ads = data1.filter(d => d.PROGRAM === selectedProg && d.TANGGAL === date);

                let nonCprp = 0;
                let cprp = 0;

                ads.forEach(ad => {
                    const dur = parseFloat(ad['MENIT IKLAN'] || ad.MENIT_IKLAN || 0);
                    if (ad.TIPE === 'NON CPRP') nonCprp += dur;
                    if (ad.TIPE === 'CPRP') cprp += dur;
                });

                const totalIklan = nonCprp + cprp;
                const cbDurMin = totalIklan;
                const cbPct = slotDurMin > 0 ? ((cbDurMin / slotDurMin) * 100).toFixed(1) + '%' : '0%';
                const nonCprpPct = totalIklan > 0 ? Math.round((nonCprp / totalIklan) * 100) + '%' : '0%';
                const cprpPct = totalIklan > 0 ? Math.round((cprp / totalIklan) * 100) + '%' : '0%';
                const avail = (cbDurMin - totalIklan).toFixed(2);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="font-medium">${formatDate(date)}</td>
                    <td>${slotTime.substring(0, 5)}</td>
                    <td>${Math.round(slotDurMin)}</td>
                    <td class="bg-orange-50 font-semibold">${cbDurMin.toFixed(2)}</td>
                    <td class="bg-orange-50">${cbPct}</td>
                    <td>${nonCprp.toFixed(2)}</td>
                    <td class="font-bold">${nonCprpPct}</td>
                    <td>${cprp.toFixed(2)}</td>
                    <td class="font-bold">${cprpPct}</td>
                    <td class="font-semibold">${totalIklan.toFixed(2)}</td>
                    <td class="bg-orange-50">${avail}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
