<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Rekap Occupancy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for CSV fetch & parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* Desain Compact: Padding rapat & teks kecil (11px-12px) */
        th, td { 
            border: 1px solid #6b7280; 
            text-align: center; 
            padding: 2px 4px !important; 
            font-size: 11px !important; 
            white-space: nowrap;
        }
        .bg-yellow-header { background-color: #FFFF00; }
        .bg-orange-header { background-color: #FCE4D6; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 font-sans text-xs">

    <!-- Container Dashboard Full-screen -->
    <div class="w-full min-h-[calc(100vh-2rem)] bg-white p-5 rounded-lg shadow-md border flex flex-col justify-start">
        
        <!-- Header Dashboard -->
        <div class="flex justify-between items-center mb-3 border-b pb-2 gap-4">
            <h1 class="text-base font-bold uppercase tracking-wide">REKAP OCCUPANCY DASHBOARD</h1>
            <div id="loadingStatus" class="text-xs font-semibold text-blue-600 animate-pulse">
                ⏳ Memuat data dari Google Sheets...
            </div>
        </div>
        
        <!-- Filter Bar (Program & Rentang Tanggal) -->
        <div class="flex flex-wrap items-center gap-3 mb-4 bg-gray-50 p-3 rounded border">
            <div class="flex items-center gap-1.5">
                <label class="font-semibold text-xs">Program:</label>
                <select id="programFilter" class="p-1.5 border rounded bg-white font-semibold min-w-[180px]" disabled>
                    <option value="">-- Memuat... --</option>
                </select>
            </div>

            <!-- Filter Rentang Tanggal -->
            <div class="flex items-center gap-1.5 border-l pl-3 border-gray-300">
                <label class="font-semibold text-xs">Dari:</label>
                <input type="date" id="startDate" class="p-1 border rounded bg-white text-xs">
            </div>

            <div class="flex items-center gap-1.5">
                <label class="font-semibold text-xs">Sampai:</label>
                <input type="date" id="endDate" class="p-1 border rounded bg-white text-xs">
            </div>

            <div class="flex gap-2 ml-auto">
                <button onclick="resetFilters()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded text-xs font-medium">
                    Reset Filter
                </button>
                <button onclick="loadGoogleSheetData()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs font-semibold">
                    🔄 Refresh Data
                </button>
            </div>
        </div>

        <!-- Dashboard Header Info -->
        <div id="reportHeader" class="mb-3 hidden">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <h2 class="font-bold text-sm">REKAP OCCUPANCY</h2>
                    <p class="font-semibold text-gray-600">PERIODE: <span id="periodeText">-</span></p>
                </div>
                <p class="font-bold text-gray-800 bg-gray-100 px-2.5 py-1 rounded border">
                    AS OF: <span id="asOfText">-</span>
                </p>
            </div>
            
            <div id="programTitle" class="p-1.5 font-bold text-center text-sm uppercase bg-yellow-300 border border-black tracking-wide">
                PROGRAM NAME
            </div>
        </div>

        <!-- Compact Table Area -->
        <div class="overflow-x-auto flex-1">
            <table id="occupancyTable" class="w-auto border-collapse hidden mx-auto">
                <thead>
                    <tr class="bg-yellow-header font-bold">
                        <th rowspan="2" class="px-2">Date</th>
                        <th rowspan="2" class="px-1.5">Slot Time</th>
                        <th rowspan="2" class="px-1.5">Slot Dur<br>(Menit)</th>
                        <th colspan="2" class="bg-orange-header px-2">TOTAL CB DUR</th>
                        <th colspan="5" class="px-2">DURASI IKLAN (Menit)</th>
                        <th rowspan="2" class="bg-orange-header px-2">AVAIL</th>
                    </tr>
                    <tr class="bg-yellow-header font-bold">
                        <th class="bg-orange-header px-1.5">Dur</th>
                        <th class="bg-orange-header px-1.5">%</th>
                        <th class="px-1.5">NON CPRP</th>
                        <th class="px-1">％</th>
                        <th class="px-1.5">CPRP</th>
                        <th class="px-1">％</th>
                        <th class="px-1.5">TOTAL</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>

    <script>
        const URL_DATA_1 = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTa5_s79R3uepnlx0yGnT-KxeTAiJZNIJO4vhRWXu7HIzV5c8LmuFqnUn_phDmBzcmYhC7nQHDGzXRC/pub?gid=0&single=true&output=csv';
        const URL_DATA_2 = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTa5_s79R3uepnlx0yGnT-KxeTAiJZNIJO4vhRWXu7HIzV5c8LmuFqnUn_phDmBzcmYhC7nQHDGzXRC/pub?gid=271391032&single=true&output=csv';
        
        let data1 = [];
        let data2 = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadGoogleSheetData();
        });

        document.getElementById('programFilter').addEventListener('change', renderTable);
        document.getElementById('startDate').addEventListener('change', renderTable);
        document.getElementById('endDate').addEventListener('change', renderTable);

        async function fetchLastModified(url) {
            try {
                const response = await fetch(url, { method: 'HEAD' });
                const lastModifiedHeader = response.headers.get('Last-Modified');
                if (lastModifiedHeader) {
                    return new Date(lastModifiedHeader);
                }
            } catch (e) {
                console.warn('Gagal mengambil Last-Modified header:', e);
            }
            return new Date(); // fallback jika header disembunyikan browser
        }

        async function loadGoogleSheetData() {
            const statusEl = document.getElementById('loadingStatus');
            statusEl.innerText = '⏳ Memuat data...';
            statusEl.classList.remove('hidden', 'text-green-600', 'text-red-600');
            statusEl.classList.add('text-blue-600', 'animate-pulse');

            // Ambil info Last Modified dari header HTTP Google Sheet
            const lastModDate = await fetchLastModified(URL_DATA_1);
            setAsOfDate(lastModDate);

            Papa.parse(URL_DATA_1, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(res1) {
                    data1 = res1.data;
                    Papa.parse(URL_DATA_2, {
                        download: true,
                        header: true,
                        skipEmptyLines: true,
                        complete: function(res2) {
                            data2 = res2.data;
                            statusEl.innerText = '✅ Data Ter-update';
                            statusEl.classList.remove('animate-pulse', 'text-blue-600');
                            statusEl.classList.add('text-green-600');
                            
                            initDashboard();
                        },
                        error: function() { showError('Gagal memuat DATA 2'); }
                    });
                },
                error: function() { showError('Gagal memuat DATA 1'); }
            });
        }

        function showError(msg) {
            const statusEl = document.getElementById('loadingStatus');
            statusEl.innerText = '❌ ' + msg;
            statusEl.classList.remove('animate-pulse', 'text-blue-600');
            statusEl.classList.add('text-red-600');
        }

        function setAsOfDate(dateObj) {
            const day = String(dateObj.getDate()).padStart(2, '0');
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            const month = months[dateObj.getMonth()];
            const year = String(dateObj.getFullYear()).slice(-2);
            
            const hours = String(dateObj.getHours()).padStart(2, '0');
            const minutes = String(dateObj.getMinutes()).padStart(2, '0');

            // Format keluaran contoh: 11-SEP-26 14:30
            document.getElementById('asOfText').innerText = `${day}-${month}-${year} ${hours}:${minutes}`;
        }

        function initDashboard() {
            const programs = [...new Set(data2.map(item => item.PROGRAM))].filter(Boolean).sort();
            const filter = document.getElementById('programFilter');
            
            filter.innerHTML = programs.map(p => `<option value="${p}">${p}</option>`).join('');
            filter.disabled = false;

            renderTable();
        }

        function timeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':').map(Number);
            return (parts[0] || 0) * 60 + (parts[1] || 0) + (parts[2] || 0) / 60;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${d.getDate()}-${months[d.getMonth()]}`;
        }

        function resetFilters() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            renderTable();
        }

        function renderTable() {
            const selectedProg = document.getElementById('programFilter').value;
            if (!selectedProg) return;

            const startDateVal = document.getElementById('startDate').value;
            const endDateVal = document.getElementById('endDate').value;

            document.getElementById('reportHeader').classList.remove('hidden');
            document.getElementById('occupancyTable').classList.remove('hidden');
            document.getElementById('programTitle').innerText = selectedProg;

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let progSchedules = data2.filter(d => d.PROGRAM === selectedProg);

            if (startDateVal) {
                progSchedules = progSchedules.filter(d => new Date(d.TGL) >= new Date(startDateVal));
            }
            if (endDateVal) {
                progSchedules = progSchedules.filter(d => new Date(d.TGL) <= new Date(endDateVal));
            }

            if (progSchedules.length > 0) {
                const dates = progSchedules.map(d => new Date(d.TGL));
                const minD = new Date(Math.min(...dates));
                const opt = { month: 'long', year: 'numeric' };
                document.getElementById('periodeText').innerText = `${minD.toLocaleDateString('id-ID', opt).toUpperCase()}`;
            }

            progSchedules.forEach(row => {
                const date = row.TGL;
                const slotTime = row['SLOT TIME'] || row.SLOT_TIME || '';
                const slotDurMin = timeToMinutes(row['SLOT DUR'] || row.SLOT_DUR);

                const ads = data1.filter(d => d.PROGRAM === selectedProg && d.TANGGAL === date);

                let nonCprp = 0;
                let cprp = 0;

                ads.forEach(ad => {
                    const dur = parseFloat(ad['MENIT IKLAN'] || ad.MENIT_IKLAN || 0);
                    if (ad.TIPE === 'NON CPRP') nonCprp += dur;
                    if (ad.TIPE === 'CPRP') cprp += dur;
                });

                const totalIklan = nonCprp + cprp;
                
                // Ambil nilai dari kolom E (INVENTORY) di DATA 2 (langsung angka menit)
                const cbDurMin = parseFloat(row['INVENTORY'] || row.INVENTORY || 0); 
                
                const cbPct = slotDurMin > 0 ? ((cbDurMin / slotDurMin) * 100).toFixed(1) + '%' : '0%';
                const nonCprpPct = totalIklan > 0 ? Math.round((nonCprp / totalIklan) * 100) + '%' : '0%';
                const cprpPct = totalIklan > 0 ? Math.round((cprp / totalIklan) * 100) + '%' : '0%';

                // Rumus AVAIL: TOTAL CB DUR (Dur) - TOTAL DURASI IKLAN (Total)
                const avail = (cbDurMin - totalIklan).toFixed(2);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="font-medium">${formatDate(date)}</td>
                    <td>${slotTime.substring(0, 5)}</td>
                    <td>${Math.round(slotDurMin)}</td>
                    <td class="bg-orange-50 font-semibold">${cbDurMin.toFixed(2)}</td>
                    <td class="bg-orange-50">${cbPct}</td>
                    <td>${nonCprp.toFixed(2)}</td>
                    <td class="font-bold">${nonCprpPct}</td>
                    <td>${cprp.toFixed(2)}</td>
                    <td class="font-bold">${cprpPct}</td>
                    <td class="font-semibold">${totalIklan.toFixed(2)}</td>
                    <td class="bg-orange-50 font-bold ${avail < 0 ? 'text-red-600' : 'text-gray-800'}">${avail}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
